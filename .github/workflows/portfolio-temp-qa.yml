name: Temporary Portfolio QA
on:
  push:
    branches:
      - feature/creative-portfolio-isolated-pages
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.11.1
      - name: Browser QA 320 375 768 1440
        run: node portfolio/qa/portfolio-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            portfolio/qa/results.json
            portfolio/qa/screenshots/*.png
          if-no-files-found: ignore
