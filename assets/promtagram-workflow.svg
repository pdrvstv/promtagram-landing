<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Принцип работы Promtagram</title><desc id="desc">Схема: задача бизнеса, анализ данных, AI-скоринг, карта мер, финансовая структура, Risk QA, документы и следующий шаг.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf5f9"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08283c" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0b83bd"/></marker></defs><rect width="1600" height="1000" rx="36" fill="url(#bg)"/><g opacity=".24" stroke="#8fb7ca" stroke-width="1"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600"/><path d="M160 0V1000M320 0V1000M480 0V1000M640 0V1000M800 0V1000M960 0V1000M1120 0V1000M1280 0V1000M1440 0V1000"/></g><text x="110" y="105" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="3" fill="#087fb8">PROMTAGRAM / КОНТУР РЕШЕНИЯ</text><text x="110" y="165" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#08283c">От задачи бизнеса — к проверенному маршруту действий</text><g fill="none" stroke="#0b83bd" stroke-width="5" marker-end="url(#arrow)"><path d="M350 345H500"/><path d="M760 345H910"/><path d="M1170 345H1310"/><path d="M1430 460V600"/><path d="M1310 715H1170"/><path d="M910 715H760"/><path d="M500 715H350"/></g><g filter="url(#shadow)" font-family="Arial,sans-serif"><g transform="translate(110 255)"><rect width="240" height="180" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">01</text><text x="28" y="102" font-size="25" font-weight="700" fill="#08283c">Задача бизнеса</text><text x="28" y="137" font-size="17" fill="#587080">цель · сумма · сроки</text><text x="28" y="163" font-size="17" fill="#587080">регион · отрасль</text></g><g transform="translate(500 255)"><rect width="260" height="180" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">02</text><text x="28" y="102" font-size="25" font-weight="700" fill="#08283c">Анализ данных</text><text x="28" y="137" font-size="17" fill="#587080">финансы · активы</text><text x="28" y="163" font-size="17" fill="#587080">документы · ограничения</text></g><g transform="translate(910 255)"><rect width="260" height="180" rx="24" fill="#06283d" stroke="#06283d"/><circle cx="42" cy="42" r="22" fill="#0b83bd"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">03</text><text x="28" y="102" font-size="25" font-weight="700" fill="#fff">AI-скоринг</text><text x="28" y="137" font-size="17" fill="#bcd2df">применимость</text><text x="28" y="163" font-size="17" fill="#bcd2df">приоритет · риски</text></g><g transform="translate(1310 255)"><rect width="180" height="205" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">04</text><text x="25" y="102" font-size="23" font-weight="700" fill="#08283c">Карта мер</text><text x="25" y="137" font-size="16" fill="#587080">финансирование</text><text x="25" y="162" font-size="16" fill="#587080">лизинг</text><text x="25" y="187" font-size="16" fill="#587080">субсидии</text></g><g transform="translate(1170 625)"><rect width="260" height="180" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">05</text><text x="28" y="102" font-size="23" font-weight="700" fill="#08283c">Структура проекта</text><text x="28" y="137" font-size="17" fill="#587080">источники средств</text><text x="28" y="163" font-size="17" fill="#587080">график · обеспечение</text></g><g transform="translate(760 625)"><rect width="260" height="180" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">06</text><text x="28" y="102" font-size="25" font-weight="700" fill="#08283c">Risk QA</text><text x="28" y="137" font-size="17" fill="#587080">стоп-факторы</text><text x="28" y="163" font-size="17" fill="#587080">проверка источников</text></g><g transform="translate(350 625)"><rect width="260" height="180" rx="24" fill="#fff" stroke="#c9dce7"/><circle cx="42" cy="42" r="22" fill="#e8f4fa"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#087fb8">07</text><text x="28" y="102" font-size="25" font-weight="700" fill="#08283c">Документы</text><text x="28" y="137" font-size="17" fill="#587080">матрица · расчёты</text><text x="28" y="163" font-size="17" fill="#587080">паспорт проекта</text></g><g transform="translate(70 625)"><rect width="280" height="180" rx="24" fill="#0b83bd" stroke="#0b83bd"/><circle cx="42" cy="42" r="22" fill="#fff" opacity=".18"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">08</text><text x="28" y="102" font-size="24" font-weight="700" fill="#fff">Следующий шаг</text><text x="28" y="137" font-size="17" fill="#e9f7fd">кому обращаться</text><text x="28" y="163" font-size="17" fill="#e9f7fd">что готовить · когда</text></g></g><text x="110" y="910" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#08283c">Результат: не список программ, а управляемый маршрут проекта.</text><text x="110" y="950" font-family="Arial,sans-serif" font-size="17" fill="#587080">Официальные источники → применимость → риски → структура → комплект действий</text></svg>