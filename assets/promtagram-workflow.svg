<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Принцип работы Promtagram</title>
<desc id="desc">Ровная блок-схема из пяти последовательных этапов: входные данные, AI-скоринг, проверка, конструкция решения и предметный результат.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce8ee" stroke-width="1"/></pattern>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0b83bd"/></marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="80" y="82" font-size="20" font-weight="700" letter-spacing="3" fill="#0b83bd">04 / ПРЕДМЕТНЫЙ РЕЗУЛЬТАТ</text>
  <text x="80" y="145" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#08283c">Как работает Promtagram</text>
  <text x="80" y="190" font-size="21" fill="#587080">Один линейный контур: данные → проверка → конструкция решения → действие</text>

  <g stroke="#0b83bd" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M350 415H370"/>
    <path d="M648 415H668"/>
    <path d="M946 415H966"/>
    <path d="M1244 415H1264"/>
  </g>

  <g>
    <g transform="translate(80 300)">
      <rect width="270" height="230" rx="12" fill="#fff" stroke="#bcd1dd" stroke-width="2"/>
      <rect width="270" height="8" rx="4" fill="#0b83bd"/>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#0b83bd">01</text>
      <text x="24" y="82" font-size="23" font-weight="700" fill="#08283c">ВХОДНЫЕ ДАННЫЕ</text>
      <line x1="24" y1="103" x2="246" y2="103" stroke="#d6e4eb"/>
      <text x="24" y="135" font-size="17" fill="#496578">Компания и регион</text>
      <text x="24" y="165" font-size="17" fill="#496578">Цифры и документы</text>
      <text x="24" y="195" font-size="17" fill="#496578">Задача · сумма · срок</text>
    </g>

    <g transform="translate(378 300)">
      <rect width="270" height="230" rx="12" fill="#fff" stroke="#bcd1dd" stroke-width="2"/>
      <rect width="270" height="8" rx="4" fill="#0b83bd"/>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#0b83bd">02</text>
      <text x="24" y="82" font-size="23" font-weight="700" fill="#08283c">AI-СКОРИНГ</text>
      <line x1="24" y1="103" x2="246" y2="103" stroke="#d6e4eb"/>
      <text x="24" y="135" font-size="17" fill="#496578">Финансовая модель</text>
      <text x="24" y="165" font-size="17" fill="#496578">Подходящие инструменты</text>
      <text x="24" y="195" font-size="17" fill="#496578">Приоритет вариантов</text>
    </g>

    <g transform="translate(676 300)">
      <rect width="270" height="230" rx="12" fill="#08283c" stroke="#08283c" stroke-width="2"/>
      <rect width="270" height="8" rx="4" fill="#20a6d8"/>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#6fd4fa">03</text>
      <text x="24" y="82" font-size="23" font-weight="700" fill="#fff">ПРОВЕРКА</text>
      <line x1="24" y1="103" x2="246" y2="103" stroke="#365568"/>
      <text x="24" y="135" font-size="17" fill="#d1e3ec">Официальные источники</text>
      <text x="24" y="165" font-size="17" fill="#d1e3ec">Критерии и документы</text>
      <text x="24" y="195" font-size="17" fill="#d1e3ec">Риски и стоп-факторы</text>
    </g>

    <g transform="translate(974 300)">
      <rect width="270" height="230" rx="12" fill="#fff" stroke="#bcd1dd" stroke-width="2"/>
      <rect width="270" height="8" rx="4" fill="#0b83bd"/>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#0b83bd">04</text>
      <text x="24" y="82" font-size="23" font-weight="700" fill="#08283c">КОНСТРУКЦИЯ</text>
      <line x1="24" y1="103" x2="246" y2="103" stroke="#d6e4eb"/>
      <text x="24" y="135" font-size="17" fill="#496578">Финансирование</text>
      <text x="24" y="165" font-size="17" fill="#496578">Господдержка · GR</text>
      <text x="24" y="195" font-size="17" fill="#496578">Сбыт и структура сделки</text>
    </g>

    <g transform="translate(1272 300)">
      <rect width="270" height="230" rx="12" fill="#0b83bd" stroke="#0b83bd" stroke-width="2"/>
      <rect width="270" height="8" rx="4" fill="#65d0f6"/>
      <text x="24" y="48" font-size="16" font-weight="700" fill="#dff6ff">05</text>
      <text x="24" y="82" font-size="23" font-weight="700" fill="#fff">РЕЗУЛЬТАТ</text>
      <line x1="24" y1="103" x2="246" y2="103" stroke="#4dafd5"/>
      <text x="24" y="135" font-size="17" fill="#eefaff">Проверенный маршрут</text>
      <text x="24" y="165" font-size="17" fill="#eefaff">Пакет документов</text>
      <text x="24" y="195" font-size="17" fill="#eefaff">Конкретный следующий шаг</text>
    </g>
  </g>

  <g transform="translate(80 625)">
    <rect width="1462" height="150" rx="12" fill="#f3f8fb" stroke="#c9dce7" stroke-width="2"/>
    <text x="28" y="48" font-size="17" font-weight="700" letter-spacing="2" fill="#0b83bd">PROMTAGRAM / ЕДИНЫЙ КОНТУР</text>
    <text x="28" y="91" font-size="27" font-weight="700" fill="#08283c">Не каталог программ, а инженерная сборка решения под конкретный бизнес.</text>
    <text x="28" y="124" font-size="18" fill="#587080">На выходе: что подходит → почему подходит → что мешает → какие документы нужны → что делать дальше.</text>
  </g>
</g>
</svg>